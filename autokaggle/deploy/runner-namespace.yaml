apiVersion: v1
kind: Namespace
metadata:
  name: autokaggle-runs
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.35
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: runner-no-access
  namespace: autokaggle-runs
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
  namespace: autokaggle-runs
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: explicit-deny-all
  namespace: autokaggle-runs
spec:
  endpointSelector: {}
  ingressDeny:
    - fromEntities: [all]
  egressDeny:
    - toEntities: [all]
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: runner-budget
  namespace: autokaggle-runs
spec:
  hard:
    pods: '2'
    requests.cpu: '2'
    limits.cpu: 2200m
    requests.memory: 2Gi
    limits.memory: 2304Mi
    requests.ephemeral-storage: 512Mi
    limits.ephemeral-storage: 512Mi
    persistentvolumeclaims: '2'
    requests.storage: 2Gi
    count/jobs.batch: '2'
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: autokaggle-gvisor
handler: autokaggle-runsc
scheduling:
  nodeSelector:
    autokaggle.openphil.org/sandbox: gvisor-verified
overhead:
  podFixed:
    cpu: 100m
    memory: 128Mi
